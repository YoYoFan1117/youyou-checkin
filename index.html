<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#FB923C">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="佑佑打卡">
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="apple-icon-180.png">
  <link rel="icon" type="image/png" href="favicon-32.png">
  <title>佑佑暑期打卡</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;500;700&display=swap');
    * { -webkit-tap-highlight-color: transparent; }
    body { font-family: 'Noto Sans SC', system-ui, -apple-system, sans-serif; }
    .cat-bounce { animation: bounce 2s infinite; }
    @keyframes bounce { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-8px)} }
    .pop { animation: pop 0.25s ease; }
    @keyframes pop { 0%{transform:scale(1)} 50%{transform:scale(1.18)} 100%{transform:scale(1)} }
    .bar { transition: width .5s ease; }
    .task-row { transition: background-color .2s; }
    .confetti {
      position: fixed; pointer-events: none; width: 10px; height: 10px;
      background: #f87171; border-radius: 50%; animation: fall 1.2s ease-out forwards;
      z-index: 100;
    }
    @keyframes fall { to { transform: translateY(100vh) rotate(720deg); opacity: 0; } }
    .slide-up { animation: slideUp .25s ease; }
    @keyframes slideUp { from{transform:translateY(100%);opacity:0} to{transform:translateY(0);opacity:1} }
    .modal-show { animation: fadeIn .2s ease; }
    @keyframes fadeIn { from{opacity:0} to{opacity:1} }
    input, select, textarea { font-size: 16px; }
  </style>
</head>
<body class="bg-orange-50 text-gray-800">
  <div class="max-w-md mx-auto min-h-screen pb-28">
    <!-- 顶部 -->
    <div class="bg-gradient-to-r from-orange-300 via-pink-300 to-purple-300 p-4 rounded-b-3xl shadow">
      <h1 class="text-xl font-bold text-white text-center">🐱 佑佑暑期打卡</h1>
      <p id="dateLine" class="text-center text-white/90 text-sm mt-1"></p>
      <div id="syncBar" class="mt-2 bg-white/20 rounded-lg px-3 py-1 text-center text-xs text-white flex items-center justify-center gap-2">
        <span id="syncIcon">⏳</span>
        <span id="syncText">正在同步...</span>
        <button id="syncMenuBtn" class="ml-2 underline text-white/80">同步码</button>
      </div>
      <div class="mt-3 bg-white/30 rounded-xl p-2">
        <div class="flex justify-between text-xs text-white mb-1">
          <span>暑假进度</span><span id="progressText"></span>
        </div>
        <div class="h-2 bg-white/40 rounded-full overflow-hidden">
          <div id="summerBar" class="h-full bg-white rounded-full bar" style="width:0%"></div>
        </div>
      </div>
    </div>

  <!-- 添加/编辑任务弹窗 -->
  <div id="taskModal" class="fixed inset-0 bg-black/50 hidden items-end sm:items-center justify-center z-50 p-4">
    <div class="bg-white rounded-2xl w-full max-w-sm p-4 max-h-[85vh] overflow-y-auto modal-show">

        <label class="block text-sm text-gray-600 mb-1">总数量（累计任务）</label>

      </div>

        <label class="block text-sm text-gray-600 mb-1">每周哪一天</label>

          <option value="0">周日</option><option value="1">周一</option><option value="2">周二</option>
          <option value="3">周三</option><option value="4">周四</option><option value="5">周五</option><option value="6">周六</option>
        </select>
      </div>
      <label class="block text-sm text-gray-600 mb-1">完成奖励猫粮</label>
      <input type="number" id="taskRewardInput" class="w-full border rounded-xl px-3 py-2 mb-4 text-sm" value="5" min="1" />
      <div class="flex gap-2">
        <button id="saveTaskBtn" class="flex-1 bg-orange-400 text-white py-2 rounded-xl font-bold">保存</button>
        <button id="cancelTaskBtn" class="flex-1 bg-gray-100 text-gray-700 py-2 rounded-xl font-bold">取消</button>
      </div>
    </div>
  </div>

  <script>
    // ================= 常量 =================
    const LEVELS = [
      { min: 0, title: '小奶猫', emoji: '😺' },
      { min: 60, title: '小猫', emoji: '🐱' },
      { min: 150, title: '少年猫', emoji: '😼' },
      { min: 300, title: '大猫', emoji: '🐯' },
      { min: 500, title: '猫王', emoji: '👑🐱' }
    ];
    const STORAGE_KEY = 'summerCheckin_v3';
    const SUBJECT_STYLE = {
      '语文': { badge: 'bg-red-100 text-red-600', dot: 'bg-red-400' },
      '数学': { badge: 'bg-blue-100 text-blue-600', dot: 'bg-blue-400' },
      '英语': { badge: 'bg-purple-100 text-purple-600', dot: 'bg-purple-400' },
      '其他': { badge: 'bg-gray-100 text-gray-600', dot: 'bg-gray-400' }
    };
    const FREQ_LABEL = { daily: '每天', every2: '两天一次', weekly: '每周', count: '累计' };

    // 用户指定的新任务清单
    const DEFAULT_TASKS = [
      // 数学
      { id: 't1', subject: '数学', name: '学而思网课', freq: 'daily', reward: 8 },
      { id: 't2', subject: '数学', name: '学而思习题', freq: 'daily', reward: 6 },
      // 语文
      { id: 't3', subject: '语文', name: '学而思网课', freq: 'daily', reward: 8 },
      { id: 't4', subject: '语文', name: '练字', freq: 'daily', reward: 5 },
      { id: 't5', subject: '语文', name: '好词好句摘抄', freq: 'daily', reward: 5 },
      { id: 't6', subject: '语文', name: '过好暑假', freq: 'daily', reward: 5 },
      { id: 't7', subject: '语文', name: '学霸阅读一篇', freq: 'daily', reward: 6 },
      // 英语
      { id: 't8', subject: '英语', name: 'Trainer 一篇', freq: 'daily', reward: 6 },
      { id: 't9', subject: '英语', name: '刺猬英语网课', freq: 'daily', reward: 8 },
      { id: 't10', subject: '英语', name: '刺猬英语练习题', freq: 'daily', reward: 6 },
      { id: 't11', subject: '英语', name: '刺猬英语单词默写', freq: 'daily', reward: 5 },
      { id: 't12', subject: '英语', name: '百词斩', freq: 'daily', reward: 5 },
      { id: 't13', subject: '英语', name: '思悦', freq: 'daily', reward: 6 }
    ];

    // ================= 工具函数 =================
    function fmtDate(d) {
      const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), day = String(d.getDate()).padStart(2, '0');
      return `${y}-${m}-${day}`;
    }
    function parseDate(s) { return new Date(s + 'T00:00:00'); }
    function dayDiff(a, b) {
      const ms = 86400000;
      return Math.round((parseDate(fmtDate(b)) - parseDate(fmtDate(a))) / ms);
    }
    function cnWeekday(d) {
      return ['周日', '周一', '周二', '周三', '周四', '周五', '周六'][d.getDay()];
    }
    function uid() { return 't' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6); }

    // ================= 状态 =================
    const today = new Date();
    const todayStr = fmtDate(today);

    function defaultState() {
      return {
        version: 3,
        startDate: '2026-07-01',
        endDate: '2026-08-31',
        catName: '茶杯',
        food: 0,
        hunger: 0,
        growth: 0,
        lastDate: todayStr,
        tasks: JSON.parse(JSON.stringify(DEFAULT_TASKS)),
        completed: {},   // taskId -> dateStr  （daily/every2/weekly 当天是否完成）
        counts: {},      // taskId -> number   （count 类累计完成数量）
        history: {}      // dateStr -> {done, total, status}
      };
    }

    let state = JSON.parse(localStorage.getItem(STORAGE_KEY)) || defaultState();

    // 字段补全（兼容旧数据）
    (function migrate() {
      const defs = defaultState();
      for (const k in defs) {
        if (state[k] === undefined) state[k] = defs[k];
      }
      if (!Array.isArray(state.tasks) || state.tasks.length === 0) {
        state.tasks = JSON.parse(JSON.stringify(DEFAULT_TASKS));
      }
      // 确保每个任务有 id
      state.tasks.forEach(t => { if (!t.id) t.id = uid(); });
    })();

    // 新一天：记录昨日完成情况，饥饿度上升
    if (state.lastDate !== todayStr) {
      state.history[state.lastDate] = computeDateStatus(parseDate(state.lastDate));
      state.hunger = Math.min(100, state.hunger + 25);
      state.lastDate = todayStr;
    }

    // ================= 云同步（jsonblob.com 免费云存储）=================
    const CLOUD_KEY = 'youyou_cloud_id';
    let cloudId = localStorage.getItem(CLOUD_KEY) || '';
    let syncTimer = null;

    async function cloudSave() {
      if (!cloudId) return; // 没有云ID时只存本地
      try {
        await fetch(`https://jsonblob.com/api/jsonBlob/${cloudId}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(state)
        });
      } catch (e) { /* 离线时静默失败 */ }
    }

    async function cloudLoad() {
      if (!cloudId) return null;
      try {
        const res = await fetch(`https://jsonblob.com/api/jsonBlob/${cloudId}`);
        if (res.ok) return await res.json();
      } catch (e) {}
      return null;
    }

    async function cloudCreate() {
      try {
        const res = await fetch('https://jsonblob.com/api/jsonBlob', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(state)
        });
        // 从 Location header 获取 ID
        const loc = res.headers.get('Location') || '';
        const id = loc.split('/').pop();
        if (id) {
          cloudId = id;
          localStorage.setItem(CLOUD_KEY, id);
          return id;
        }
      } catch (e) {}
      return null;
    }

    function save() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
      render();
      // 防抖同步到云端（500ms内多次操作只同步一次）
      if (syncTimer) clearTimeout(syncTimer);
      syncTimer = setTimeout(cloudSave, 500);
    }

    // 计算某一天的完成情况 {done, total, status}
    function computeDateStatus(date) {
      const dStr = fmtDate(date);
      let done = 0, total = 0;
      state.tasks.forEach(t => {
        if (t.freq === 'count') {
          // 累计任务：完成前每天都算待完成；完成后不再计入
          const tot = countTotal(t);
          const cur = countDone(t);
          if (cur < tot) {
            total += 1;
            // 当天是否完成过累计任务无法精确回溯，按当前是否全部完成判断
            if (cur >= tot) done += 1;
          }
        } else {
          if (!isTaskDue(t, date)) return;
          total += 1;
          if (state.completed[t.id] === dStr) done += 1;
        }
      });
      let status = 'none';
      if (total > 0) {
        if (done === total) status = 'full';
        else if (done / total >= 0.5) status = 'partial';
        else status = 'miss';
      }
      return { done, total, status };
    }

    // ================= 任务调度 =================
    function isTaskDue(task, date) {
      if (task.freq === 'daily') return true;
      if (task.freq === 'every2') {
        const idx = dayDiff(parseDate(state.startDate), date);
        return idx >= 0 && idx % 2 === 0;
      }
      if (task.freq === 'weekly') return date.getDay() === (task.weekday || 0);
      if (task.freq === 'count') return true;
      return false;
    }
    function isCompletedToday(task) {
      return state.completed[task.id] === todayStr;
    }
    function countDone(task) { return state.counts[task.id] || 0; }
    function countTotal(task) { return task.total || 1; }

    function toggleTask(task, e) {
      const done = isCompletedToday(task);
      if (done) {
        // 取消完成
        delete state.completed[task.id];
        state.food = Math.max(0, state.food - task.reward);
      } else {
        state.completed[task.id] = todayStr;
        state.food += task.reward;
        triggerConfetti(e);
      }
      save();
    }

    function changeCount(task, delta, e) {
      const cur = countDone(task);
      const total = countTotal(task);
      const next = Math.max(0, Math.min(total, cur + delta));
      if (next === cur) return;
      const diff = next - cur;
      state.counts[task.id] = next;
      state.food = Math.max(0, state.food + diff * task.reward);
      if (diff > 0) triggerConfetti(e);
      save();
    }

    function triggerConfetti(e) {
      const colors = ['#f87171', '#fbbf24', '#34d399', '#60a5fa', '#a78bfa', '#f472b6'];
      const x = e && e.clientX ? e.clientX : window.innerWidth / 2;
      const y = e && e.clientY ? e.clientY : window.innerHeight / 2;
      for (let i = 0; i < 18; i++) {
        const el = document.createElement('div');
        el.className = 'confetti';
        el.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
        el.style.left = (x + (Math.random() - 0.5) * 80) + 'px';
        el.style.top = (y + (Math.random() - 0.5) * 60) + 'px';
        el.style.transform = `translate(${(Math.random() - 0.5) * 200}px, ${(Math.random() - 0.5) * 200}px)`;
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 1200);
      }
    }

    // ================= 猫咪 =================
    function currentLevel() {
      for (let i = LEVELS.length - 1; i >= 0; i--) {
        if (state.growth >= LEVELS[i].min) return LEVELS[i];
      }
      return LEVELS[0];
    }
    function feedCat() {
      if (state.food < 10) { alert('猫粮不够啦，先去完成任务吧！'); return; }
      if (state.hunger <= 0) { alert('猫咪已经饱饱的啦～'); return; }
      state.food -= 10;
      state.hunger = Math.max(0, state.hunger - 20);
      state.growth += 15;
      save();
      const av = document.getElementById('catAvatar');
      av.classList.remove('pop'); void av.offsetWidth; av.classList.add('pop');
    }

    // ================= 渲染 =================
    function render() {
      // 日期 + 暑假进度
      document.getElementById('dateLine').textContent = `${todayStr} ${cnWeekday(today)}`;
      const start = parseDate(state.startDate), end = parseDate(state.endDate);
      const totalDays = Math.max(1, dayDiff(start, end) + 1);
      const passed = Math.max(0, Math.min(totalDays, dayDiff(start, today) + 1));
      const pct = Math.round(passed / totalDays * 100);
      document.getElementById('progressText').textContent = `${passed}/${totalDays}天`;
      document.getElementById('summerBar').style.width = pct + '%';

      // 猫咪
      const level = currentLevel();
      const av = document.getElementById('catAvatar');
      // 根据饥饿度给头像加轻微视觉提示
      av.style.filter = state.hunger >= 90 ? 'grayscale(0.6) brightness(0.9)' : state.hunger >= 70 ? 'grayscale(0.3)' : 'none';
      document.getElementById('catName').textContent = state.catName;
      document.getElementById('catLevel').textContent = `Lv.${LEVELS.indexOf(level) + 1} ${level.title}（成长 ${state.growth}）`;
      document.getElementById('foodCount').textContent = state.food;
      document.getElementById('hungerText').textContent = state.hunger + '%';
      document.getElementById('hungerBar').style.width = state.hunger + '%';
      document.getElementById('hungerBar').className = `h-full rounded-full bar ${state.hunger < 30 ? 'bg-green-400' : state.hunger < 70 ? 'bg-yellow-400' : 'bg-red-400'}`;
      document.getElementById('growthText').textContent = state.growth;
      const next = LEVELS[LEVELS.indexOf(level) + 1];
      const growthPct = next ? Math.min(100, (state.growth - level.min) / (next.min - level.min) * 100) : 100;
      document.getElementById('growthBar').style.width = growthPct + '%';
      let msg = '今天也要加油打卡哦～';
      if (state.hunger >= 80) msg = '我好饿，快完成任务赚猫粮吧！';
      else if (state.hunger === 0 && state.growth > 0) msg = '吃得好饱，谢谢小主人！';
      document.getElementById('catMsg').textContent = msg;

      // 任务列表（按科目分组）
      const list = document.getElementById('taskList');
      list.innerHTML = '';
      const groups = {};
      state.tasks.forEach(t => {
        // count 类总是显示；其他类只在当天需要完成时显示
        if (t.freq !== 'count' && !isTaskDue(t, today)) return;
        groups[t.subject] = groups[t.subject] || [];
        groups[t.subject].push(t);
      });

      let doneAll = 0, totalAll = 0;
      for (const subject of ['语文', '数学', '英语', '其他']) {
        const tasks = groups[subject];
        if (!tasks || tasks.length === 0) continue;
        const style = SUBJECT_STYLE[subject] || SUBJECT_STYLE['其他'];
        const section = document.createElement('div');
        section.className = 'bg-white rounded-2xl shadow overflow-hidden';
        const header = document.createElement('div');
        header.className = `px-4 py-2 font-bold text-sm flex items-center gap-2 ${style.badge}`;
        header.innerHTML = `<span class="w-2 h-2 rounded-full ${style.dot}"></span>${subject}`;
        section.appendChild(header);

        tasks.forEach(task => {
          const row = document.createElement('div');
          row.className = 'task-row flex items-center justify-between px-4 py-3 border-t border-gray-100';
          const completed = task.freq === 'count' ? countDone(task) >= countTotal(task) : isCompletedToday(task);
          if (completed) row.classList.add('bg-green-50');

          const left = document.createElement('div');
          left.className = 'flex-1 pr-3 min-w-0';
          const nameRow = document.createElement('div');
          nameRow.className = 'flex items-center gap-1';
          const name = document.createElement('span');
          name.className = 'text-sm font-medium' + (completed ? ' text-gray-400 line-through' : '');
          name.textContent = task.name;
          nameRow.appendChild(name);
          left.appendChild(nameRow);
          const meta = document.createElement('div');
          meta.className = 'flex items-center gap-2 mt-1';
          const badge = document.createElement('span');
          badge.className = 'text-[10px] px-1.5 py-0.5 rounded bg-gray-100 text-gray-500';
          let label = FREQ_LABEL[task.freq] || '每天';
          if (task.freq === 'count') label = `累计 ${countDone(task)}/${countTotal(task)}`;
          badge.textContent = label;
          meta.appendChild(badge);
          const reward = document.createElement('span');
          reward.className = 'text-[10px] text-orange-500';
          reward.textContent = `+${task.reward}粮`;
          meta.appendChild(reward);
          left.appendChild(meta);

          const right = document.createElement('div');
          right.className = 'flex items-center gap-1';
          if (task.freq === 'count') {
            const minus = document.createElement('button');
            minus.className = 'w-8 h-8 rounded-full bg-gray-100 text-gray-600 font-bold flex items-center justify-center';
            minus.textContent = '−';
            minus.onclick = (e) => changeCount(task, -1, e);
            const plus = document.createElement('button');
            plus.className = 'w-8 h-8 rounded-full bg-orange-400 text-white font-bold shadow flex items-center justify-center';
            plus.textContent = '+';
            plus.onclick = (e) => changeCount(task, 1, e);
            right.appendChild(minus);
            right.appendChild(plus);
          } else {
            const btn = document.createElement('button');
            btn.className = `w-9 h-9 rounded-full border-2 flex items-center justify-center ${completed ? 'bg-green-500 border-green-500' : 'border-gray-300 bg-white'}`;
            btn.innerHTML = completed ? '<svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" stroke-width="3" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path></svg>' : '';
            btn.onclick = (e) => toggleTask(task, e);
            right.appendChild(btn);
          }
          // 编辑/删除按钮
          const editBtn = document.createElement('button');
          editBtn.className = 'w-8 h-8 rounded-full text-gray-400 flex items-center justify-center';
          editBtn.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path></svg>';
          editBtn.onclick = () => openTaskModal(task);
          const delBtn = document.createElement('button');
          delBtn.className = 'w-8 h-8 rounded-full text-red-300 flex items-center justify-center';
          delBtn.innerHTML = '<svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path></svg>';
          delBtn.onclick = () => deleteTask(task);
          right.appendChild(editBtn);
          right.appendChild(delBtn);

          row.appendChild(left);
          row.appendChild(right);
          section.appendChild(row);

          // 统计
          if (task.freq === 'count') {
            totalAll += countTotal(task);
            doneAll += countDone(task);
          } else {
            totalAll += 1;
            if (completed) doneAll += 1;
          }
        });
        list.appendChild(section);
      }

      // 空状态提示
      if (list.children.length === 0) {
        const empty = document.createElement('div');
        empty.className = 'bg-white rounded-2xl shadow p-8 text-center text-gray-400 text-sm';
        empty.textContent = '今天没有需要完成的作业，点击下方"添加作业"自行添加～';
        list.appendChild(empty);
      }

      document.getElementById('doneCount').textContent = doneAll;
      document.getElementById('totalCount').textContent = totalAll;
      const p = totalAll ? Math.round(doneAll / totalAll * 100) : 0;
      document.getElementById('percentText').textContent = p + '%';
      document.getElementById('circleProgress').setAttribute('stroke-dasharray', `${p}, 100`);

      if (p === 100 && totalAll > 0 && state.celebratedToday !== todayStr) {
        state.celebratedToday = todayStr;
        save();
        triggerConfetti();
      }
    }

    // ================= 任务增删改 =================
    let editingTaskId = null;

    function openTaskModal(task) {
      editingTaskId = task ? task.id : null;
      document.getElementById('taskModalTitle').textContent = task ? '编辑作业' : '添加作业';
      document.getElementById('taskNameInput').value = task ? task.name : '';
      document.getElementById('taskSubjectInput').value = task ? task.subject : '语文';
      document.getElementById('taskFreqInput').value = task ? task.freq : 'daily';
      document.getElementById('taskRewardInput').value = task ? task.reward : 5;
      document.getElementById('taskTotalInput').value = task && task.total ? task.total : 8;
      document.getElementById('taskWeekdayInput').value = task && task.weekday !== undefined ? task.weekday : 0;
      onFreqChange();
      document.getElementById('taskModal').classList.replace('hidden', 'flex');
    }
    function closeTaskModal() {
      document.getElementById('taskModal').classList.replace('flex', 'hidden');
      editingTaskId = null;
    }
    function onFreqChange() {
      const f = document.getElementById('taskFreqInput').value;
      document.getElementById('countTotalWrap').classList.toggle('hidden', f !== 'count');
      document.getElementById('weekdayWrap').classList.toggle('hidden', f !== 'weekly');
    }
    function saveTask() {
      const name = document.getElementById('taskNameInput').value.trim();
      if (!name) { alert('请输入作业名称'); return; }
      const subject = document.getElementById('taskSubjectInput').value;
      const freq = document.getElementById('taskFreqInput').value;
      const reward = Math.max(1, parseInt(document.getElementById('taskRewardInput').value) || 5);
      const data = { name, subject, freq, reward };
      if (freq === 'count') data.total = Math.max(1, parseInt(document.getElementById('taskTotalInput').value) || 8);
      if (freq === 'weekly') data.weekday = parseInt(document.getElementById('taskWeekdayInput').value);

      if (editingTaskId) {
        const idx = state.tasks.findIndex(t => t.id === editingTaskId);
        if (idx >= 0) state.tasks[idx] = { ...state.tasks[idx], ...data };
      } else {
        state.tasks.push({ id: uid(), ...data });
      }
      closeTaskModal();
      save();
    }
    function deleteTask(task) {
      if (!confirm(`确定删除"${task.name}"吗？`)) return;
      state.tasks = state.tasks.filter(t => t.id !== task.id);
      delete state.completed[task.id];
      delete state.counts[task.id];
      save();
    }

    // ================= 家长报告 =================
    function buildReport() {
      let lines = [];
      lines.push(`【佑佑暑期打卡·${state.catName}】${todayStr} ${cnWeekday(today)}`);
      let done = 0, total = 0;
      const groups = {};
      state.tasks.forEach(t => {
        if (t.freq !== 'count' && !isTaskDue(t, today)) return;
        groups[t.subject] = groups[t.subject] || [];
        groups[t.subject].push(t);
      });
      for (const subject of ['语文', '数学', '英语', '其他']) {
        const tasks = groups[subject];
        if (!tasks || tasks.length === 0) continue;
        lines.push(`【${subject}】`);
        tasks.forEach(t => {
          let status = '';
          if (t.freq === 'count') {
            const c = countDone(t), tot = countTotal(t);
            status = c >= tot ? '✅ 已完成' : `⬜ ${c}/${tot}`;
            total += tot; done += c;
          } else {
            const ok = isCompletedToday(t);
            status = ok ? '✅' : '⬜';
            total += 1; if (ok) done += 1;
          }
          lines.push(`  ${t.name} ${status}`);
        });
      }
      const level = currentLevel();
      lines.push('');
      lines.push(`今日完成：${done}/${total}（${total ? Math.round(done/total*100) : 0}%）`);
      lines.push(`猫粮：${state.food}｜猫咪：Lv.${LEVELS.indexOf(level)+1} ${level.title}｜成长：${state.growth}｜饥饿：${state.hunger}%`);
      return lines.join('\n');
    }

    // ================= 打卡日历 =================
    let calYear = today.getFullYear(), calMonth = today.getMonth();

    function openCalendar() {
      document.getElementById('calendarModal').classList.replace('hidden', 'flex');
      renderCalendar();
    }
    function closeCalendar() { document.getElementById('calendarModal').classList.replace('flex', 'hidden'); }

    function renderCalendar() {
      document.getElementById('calTitle').textContent = `${calYear}年${calMonth + 1}月`;
      const grid = document.getElementById('calGrid');
      grid.innerHTML = '';

      const first = new Date(calYear, calMonth, 1);
      const daysInMonth = new Date(calYear, calMonth + 1, 0).getDate();
      const startWeekday = first.getDay(); // 0 周日

      // 空白占位
      for (let i = 0; i < startWeekday; i++) {
        const cell = document.createElement('div');
        cell.className = 'h-12';
        grid.appendChild(cell);
      }

      let fullDays = 0, partialDays = 0, missDays = 0;
      for (let d = 1; d <= daysInMonth; d++) {
        const date = new Date(calYear, calMonth, d);
        const dStr = fmtDate(date);
        const isToday = dStr === todayStr;

        let info;
        if (isToday) {
          info = computeDateStatus(date);
        } else if (state.history[dStr]) {
          info = state.history[dStr];
        } else if (fmtDate(date) < todayStr) {
          info = computeDateStatus(date);
        } else {
          info = { done: 0, total: 0, status: 'none' };
        }

        if (info.status === 'full') fullDays++;
        else if (info.status === 'partial') partialDays++;
        else if (info.status === 'miss') missDays++;

        const cell = document.createElement('div');
        cell.className = `h-12 rounded-xl flex flex-col items-center justify-center text-sm relative border-2 ${isToday ? 'border-orange-400' : 'border-transparent'} ${
          info.status === 'full' ? 'bg-green-100 text-green-700' :
          info.status === 'partial' ? 'bg-yellow-100 text-yellow-700' :
          info.status === 'miss' ? 'bg-red-100 text-red-700' : 'bg-gray-100 text-gray-400'
        }`;
        cell.innerHTML = `<span class="font-bold">${d}</span>`;
        if (info.total > 0) {
          const sub = document.createElement('span');
          sub.className = 'text-[9px] leading-none mt-0.5';
          sub.textContent = `${info.done}/${info.total}`;
          cell.appendChild(sub);
        }
        cell.title = `${dStr} 完成 ${info.done}/${info.total}`;
        grid.appendChild(cell);
      }

      document.getElementById('calSummary').textContent =
        `全勤 ${fullDays} 天 · 部分完成 ${partialDays} 天 · 茶杯饿了 ${missDays} 天`;
    }

    document.getElementById('calendarBtn').onclick = openCalendar;
    document.getElementById('closeCalendar').onclick = closeCalendar;
    document.getElementById('calPrev').onclick = () => {
      calMonth--;
      if (calMonth < 0) { calMonth = 11; calYear--; }
      renderCalendar();
    };
    document.getElementById('calNext').onclick = () => {
      calMonth++;
      if (calMonth > 11) { calMonth = 0; calYear++; }
      renderCalendar();
    };

    // ================= 事件绑定 =================
    document.getElementById('feedBtn').onclick = feedCat;
    document.getElementById('addTaskBtn').onclick = () => openTaskModal(null);
    document.getElementById('taskFreqInput').onchange = onFreqChange;
    document.getElementById('saveTaskBtn').onclick = saveTask;
    document.getElementById('cancelTaskBtn').onclick = closeTaskModal;

    document.getElementById('reportBtn').onclick = () => {
      document.getElementById('reportText').value = buildReport();
      document.getElementById('reportModal').classList.replace('hidden', 'flex');
    };
    document.getElementById('closeReport').onclick = () => document.getElementById('reportModal').classList.replace('flex', 'hidden');
    document.getElementById('copyReport').onclick = async () => {
      const txt = document.getElementById('reportText');
      txt.select();
      try {
        await navigator.clipboard.writeText(txt.value);
        alert('已复制，可粘贴到微信发给家长！');
      } catch (e) {
        document.execCommand('copy');
        alert('已复制，可粘贴到微信发给家长！');
      }
    };

    document.getElementById('settingsBtn').onclick = () => {
      document.getElementById('nameInput').value = state.catName;
      document.getElementById('startInput').value = state.startDate;
      document.getElementById('endInput').value = state.endDate;
      document.getElementById('settingsModal').classList.replace('hidden', 'flex');
    };
    document.getElementById('closeSettings').onclick = () => document.getElementById('settingsModal').classList.replace('flex', 'hidden');
    document.getElementById('saveSettings').onclick = () => {
      state.catName = document.getElementById('nameInput').value || '茶杯';
      state.startDate = document.getElementById('startInput').value;
      state.endDate = document.getElementById('endInput').value;
      document.getElementById('settingsModal').classList.replace('flex', 'hidden');
      save();
    };
    document.getElementById('resetData').onclick = () => {
      if (confirm('确定清空所有数据（作业、打卡、猫咪）并恢复默认作业吗？')) {
        localStorage.removeItem(STORAGE_KEY);
        state = defaultState();
        document.getElementById('settingsModal').classList.replace('flex', 'hidden');
        save();
      }
    };

    // 点击遮罩关闭弹窗
    ['reportModal', 'settingsModal', 'taskModal', 'calendarModal', 'syncModal'].forEach(id => {
      document.getElementById(id).addEventListener('click', (e) => {
        if (e.target.id === id) e.target.classList.replace('flex', 'hidden');
      });
    });

    // ================= 同步码弹窗逻辑 =================
    function openSyncModal() {
      document.getElementById('syncCodeInput').value = cloudId || '未创建';
      document.getElementById('syncBindRow').classList.add('hidden');
      document.getElementById('syncStatus').textContent = '';
      document.getElementById('syncModal').classList.replace('hidden', 'flex');
    }
    document.getElementById('syncMenuBtn').onclick = openSyncModal;
    document.getElementById('closeSyncModal').onclick = () => document.getElementById('syncModal').classList.replace('flex', 'hidden');

    document.getElementById('createCloudBtn').onclick = async () => {
      document.getElementById('syncStatus').textContent = '正在创建...';
      const id = await cloudCreate();
      if (id) {
        document.getElementById('syncCodeInput').value = id;
        document.getElementById('syncStatus').textContent = '✅ 创建成功！把这串同步码发给其他设备绑定即可';
        updateSyncBar();
      } else {
        document.getElementById('syncStatus').textContent = '❌ 创建失败，请检查网络';
      }
    };

    document.getElementById('bindCloudBtn').onclick = () => {
      document.getElementById('syncBindRow').classList.toggle('hidden');
    };

    document.getElementById('confirmBindBtn').onclick = async () => {
      const code = document.getElementById('syncCodeBind').value.trim();
      if (!code) { alert('请输入同步码'); return; }
      document.getElementById('syncStatus').textContent = '正在拉取数据...';
      cloudId = code;
      const remote = await cloudLoad();
      if (remote) {
        state = remote;
        localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
        localStorage.setItem(CLOUD_KEY, code);
        document.getElementById('syncStatus').textContent = '✅ 绑定成功，数据已同步！';
        render();
        updateSyncBar();
      } else {
        document.getElementById('syncStatus').textContent = '❌ 同步码无效或网络错误';
        cloudId = localStorage.getItem(CLOUD_KEY) || '';
      }
    };

    document.getElementById('copySyncCode').onclick = async () => {
      const code = document.getElementById('syncCodeInput').value;
      if (code && code !== '未创建') {
        try { await navigator.clipboard.writeText(code); alert('同步码已复制：' + code); }
        catch (e) { alert('同步码：' + code); }
      }
    };

    function updateSyncBar() {
      if (cloudId) {
        document.getElementById('syncIcon').textContent = '☁️';
        document.getElementById('syncText').textContent = '已开启云同步';
      } else {
        document.getElementById('syncIcon').textContent = '📱';
        document.getElementById('syncText').textContent = '仅本机使用（点同步码开启多设备）';
      }
    }

    // ================= 初始化 =================
    // 先渲染本地数据（快速显示）
    render();
    updateSyncBar();

    // 如果有云同步码，从云端拉取最新数据
    if (cloudId) {
      cloudLoad().then(remote => {
        if (remote) {
          state = Object.assign(defaultState(), remote);
          // 新一天检查
          if (state.lastDate !== todayStr) {
            state.history[state.lastDate] = computeDateStatus(parseDate(state.lastDate));
            state.hunger = Math.min(100, state.hunger + 25);
            state.lastDate = todayStr;
            cloudSave();
          }
          localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
          render();
          document.getElementById('syncIcon').textContent = '✅';
          document.getElementById('syncText').textContent = '已同步';
          setTimeout(updateSyncBar, 2000);
        } else {
          updateSyncBar();
        }
      });
    }

    // 注册 Service Worker（PWA 离线可用）
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    }
  </script>
</body>
</html>
